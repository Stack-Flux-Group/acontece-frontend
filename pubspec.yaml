name: acontece_frontend
description: "Website da plataforma Acontece: gestao de eventos, participantes e inscricoes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Biblioteca Material (movida para fora do SDK a partir do Flutter 3.47).
  # Tambem fornece GlobalMaterialLocalizations.delegates, com suporte a 'pt'.
  material_ui: ^1.1.0

  cupertino_icons: ^1.0.8

  # Cliente HTTP oficial. Unico ponto de rede do app (lib/infraestrutura/api_client.dart).
  http: ^1.6.0

  # Formatacao de datas/numeros em pt-BR.
  intl: ^0.20.2
  web: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
